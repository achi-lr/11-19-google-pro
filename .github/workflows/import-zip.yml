name: Import ZIP from Drive
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Google Drive File ID'
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract ZIP
        run: |
          pip install -q gdown
          gdown "${{ inputs.file_id }}" -O /tmp/archive.zip
          unzip -o /tmp/archive.zip -d .
      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Import extracted archive from Drive"
          git push
